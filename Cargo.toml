[package]
name = "robostickies"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Small repository-local notes for humans and agents, through CLI and MCP"

[dependencies]
anyhow = "1"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6"
globset = "0.4"
noyalib = "=0.0.58"
redb = "4.4"
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "io-util", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
rmcp = { version = "3.7", default-features = false, features = ["client", "transport-child-process"] }
