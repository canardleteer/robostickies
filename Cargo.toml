[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[package]
name = "robostickies"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
description = "Small repository-local notes for humans and agents, through CLI and MCP"
license = "MIT"
repository = "https://github.com/canardleteer/robostickies"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/build_support/**/*.rs",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/**/*.rs",
    "/docs/usage/**/*.md",
    "/docs/assets/*",
]

[build-dependencies]
built = { version = "=0.8.1", default-features = false, features = ["gix"] }
serde_json.workspace = true

[dependencies]
anyhow.workspace = true
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap.workspace = true
directories = "6"
globset = "0.4"
noyalib = "=0.0.58"
redb = "4.4"
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "io-util", "sync"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
rmcp = { version = "3.7", default-features = false, features = ["client", "transport-child-process"] }

[[example]]
name = "profile_notes"
test = true

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
