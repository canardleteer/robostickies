name: Workspace checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: cargo xtask check (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.informative }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            informative: false
          - platform: macOS
            runner: macos-latest
            informative: true
          - platform: Windows
            runner: windows-latest
            informative: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust with formatting and lint tools
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore Rust dependencies and installed tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            . -> target
            . -> target/xtask
          cache-bin: true
          save-if: ${{ github.repository == 'canardleteer/robostickies' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install dependency checker
        run: cargo install --locked cargo-machete --version 0.9.2
      - name: Check workspace
        run: cargo xtask check
      - name: Verify package and version flags
        shell: bash
        run: |
          cargo package --locked --package robostickies
          version=$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "robostickies"))')
          manifest="target/package/robostickies-$version/Cargo.toml"
          cargo run --locked --manifest-path "$manifest" --target-dir "$GITHUB_WORKSPACE/target" -- -V
          cargo run --locked --manifest-path "$manifest" --target-dir "$GITHUB_WORKSPACE/target" -- --version
