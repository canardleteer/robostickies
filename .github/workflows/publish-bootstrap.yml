name: Bootstrap crates.io publication
run-name: Publish robostickies ${{ inputs.version }} (dry_run=${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact robostickies manifest version
        type: string
        required: true
      dry_run:
        description: Verify without uploading to crates.io
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: robostickies-crates-io-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Dispatch this workflow on main.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust with formatting and lint tools
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore Rust dependencies and installed tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace-${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            . -> target
            . -> target/xtask
          cache-bin: true
          save-if: ${{ github.repository == 'canardleteer/robostickies' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install dependency checker
        run: cargo install --locked cargo-machete --version 0.9.2
      - name: Validate requested version and registry state
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          with open("metadata.json") as source:
              packages = json.load(source)["packages"]
          version = next(p["version"] for p in packages if p["name"] == "robostickies")
          if version != os.environ["REQUESTED_VERSION"]:
              raise SystemExit(f"Requested version does not match manifest version {version}")
          request = urllib.request.Request("https://index.crates.io/ro/bo/robostickies", headers={"User-Agent": "robostickies-bootstrap"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  versions = [json.loads(line)["vers"] for line in response if line.strip()]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Cannot determine registry state: HTTP {error.code}; inspect before retrying")
              versions = []
          if version in versions:
              raise SystemExit(f"robostickies {version} is already published; choose a new manifest version")
          print(f"Manifest version {version} is not published")
          PY
      - name: Check workspace
        run: cargo xtask check
      - name: Inspect package contents
        run: |
          cargo package --locked --package robostickies --list > package-files.txt
          cat package-files.txt
          python3 - <<'PY'
          from pathlib import PurePosixPath
          with open("package-files.txt") as source:
              paths = {line.strip() for line in source if line.strip()}
          required = {"LICENSE", "README.md", "CHANGELOG.md", "docs/assets/robostickies-desk.png", "build.rs", "build_support/mod.rs", "src/main.rs"}
          if not required <= paths:
              raise SystemExit(f"Missing package files: {sorted(required - paths)}")
          allowed_roots = {"src", "tests", "examples", "build_support"}
          allowed_files = required | {"Cargo.toml", "Cargo.toml.orig", "Cargo.lock", ".cargo_vcs_info.json"}
          for path in paths:
              parts = PurePosixPath(path).parts
              if path in allowed_files or (parts[0] in allowed_roots and path.endswith(".rs")):
                  continue
              if path.startswith("docs/usage/") and path.endswith(".md"):
                  continue
              if path.startswith("docs/assets/"):
                  continue
              raise SystemExit(f"Unexpected package file: {path}")
          PY
      - name: Verify locked publication
        run: cargo publish --locked --dry-run --package robostickies --registry crates-io
      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.FIRST_CRATES_IO_RELEASE }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo '::error::FIRST_CRATES_IO_RELEASE is missing or empty.'
            exit 1
          fi
          if cargo publish --locked --package robostickies --registry crates-io; then
            echo "Published robostickies $REQUESTED_VERSION"
          else
            echo '::error::Publication failed or completion is uncertain. Inspect registry state before another dispatch.'
            python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          try:
              with urllib.request.urlopen("https://index.crates.io/ro/bo/robostickies", timeout=30) as response:
                  versions = [json.loads(line)["vers"] for line in response if line.strip()]
              print("Requested version visible in registry:", os.environ["REQUESTED_VERSION"] in versions)
          except (OSError, ValueError) as error:
              print("Registry state remains uncertain:", error)
          PY
            exit 1
          fi
