# Review the matching upstream documentation before upgrading release-plz 0.4.2.
# https://github.com/release-plz/release-plz/tree/release-plz-v0.4.2/website/docs
[workspace]
release = false
release_always = false
dependencies_update = false
pr_branch_prefix = "release-plz-"
changelog_update = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_type = "auto"
publish = true
publish_allow_dirty = false
publish_no_verify = false
semver_check = true

[[package]]
name = "robostickies"
release = true
